version: 2
updates:
  # the Caddy builder and runtime images (Dockerfile), one pull request for both
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      caddy:
        patterns: ['caddy']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
